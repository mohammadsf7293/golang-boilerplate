# Default values for deployment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
app:
  version: v2024.08.11-115105-a8abc05
  port: 8086
  protocol: TCP

replicaCount: 1

image:
  repository: task-manager
  pullPolicy: IfNotPresent
  command: ["/bin/server"]
  args: ""

env:
  fromConfigmap:
    enabled: true
    data:
      SERVER_PORT: 8086
      SERVER_TIME_OUT_IN_SECONDS: 5
      WORKER_TIME_OUT_IN_SECONDS: 15
      WORKER_LOCK_TTL_IN_SECONDS: 30
      OUTBOX_POLL_INTERVAL_MS: 500
      OUTBOX_BATCH_SIZE: 50
      RABBIT_PREFETCH_COUNT: 10
      RABBIT_MAX_RETRIES: 5
      METRICS_ENABLED: true

      DB_HOST: my-release-postgresql
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_DATABASE_TEST: postgres_test
      DB_USERNAME: postgres
      DB_SSL_MODE: disable
      DB_POOL_MAX_CONNS: 30

      RABBIT_USERNAME: user
      RABBIT_HOST: my-rabbit-rabbitmq
      RABBIT_PORT: 5672
      HIGH_PRIORITY_JOBS_QUEUE_NAME: jobs_high
      NORMAL_PRIORITY_JOBS_QUEUE_NAME: jobs_normal
      LOW_PRIORITY_JOBS_QUEUE_NAME: jobs_low
      TEST_JOBS_QUEUE_NAME: jobs_test
      RABBIT_DEAD_LETTER_EXCHANGE: jobs.dlx
      RABBIT_DEAD_LETTER_QUEUE: jobs.dlq

      REDIS_USERNAME: ""
      REDIS_HOST: my-redis-master
      REDIS_PORT: 6379
      REDIS_DB_INDEX: 0
  fromSecret:
    enabled: true
    # Maps env var name -> secret key name inside existingSecret / generated secret
    data:
      DB_PASSWORD: DB_PASSWORD
      RABBIT_PASSWORD: RABBIT_PASSWORD
      REDIS_PASSWORD: REDIS_PASSWORD

restartPolicy: Always
# Prefer an externally managed secret in production.
existingSecret: task-manager-secrets

imagePullSecrets: []
nameOverride: "myapp"
fullnameOverride: ""

serviceMonitor:
  enabled: false
  namespace: kube-monit
  interval: 10s
  scrapeTimeout: 10s
  selector:
    prometheus: kube-prometheus
    release: prometheus

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8086

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

readinessProbe:
  enabled: true
  path: "/readiness"
  initialDelaySeconds: 10
  periodSeconds: 120
  failureThreshold: 3
  timeoutSeconds: 5

livenessProbe:
  enabled: true
  path: "/liveness"
  initialDelaySeconds: 10
  periodSeconds: 120
  failureThreshold: 3
  timeoutSeconds: 5

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
