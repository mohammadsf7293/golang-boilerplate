{{- if and .Values.env.fromSecret.enabled (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deployment.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deployment.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.env.fromSecret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
